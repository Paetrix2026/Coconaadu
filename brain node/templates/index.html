<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Grid NOC</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
        :root { --neon: #00ff41; --bg: #050505; --panel: #0a0a0a; --blue: #008cff; }
        body { font-family: 'Consolas', monospace; background: var(--bg); color: var(--neon); margin: 0; display: flex; height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--panel); border-right: 1px solid #222; display: flex; flex-direction: column; }
        .device-item { padding: 15px; border-bottom: 1px solid #222; cursor: pointer; transition: 0.2s; }
        .device-item:hover { background: #001a06; }
        .device-item.active { border-left: 4px solid var(--neon); background: #001a06; }

        /* Main Area */
        .main { flex-grow: 1; padding: 20px; position: relative; }
        
        /* Inspector Modal */
        #modal { position: absolute; top: 10%; left: 5%; width: 90%; height: 80%; background: var(--panel); border: 1px solid var(--neon); display: none; flex-direction: row; box-shadow: 0 0 30px rgba(0,0,0,0.8); z-index: 100; }
        
        /* Left: Output Screens */
        .modal-display { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; overflow: hidden; }
        .tab-content { flex-grow: 1; background: black; border: 1px solid #222; padding: 15px; overflow-y: auto; display: none; }
        .tab-content.active { display: block; }

        /* Right: Vertical Icon Toolbar */
        .toolbar { width: 70px; border-left: 1px solid #222; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 20px; }
        .tool-btn { width: 45px; height: 45px; border: 1px solid var(--neon); background: none; color: var(--neon); border-radius: 8px; cursor: pointer; position: relative; font-size: 20px; }
        .tool-btn:hover { background: var(--neon); color: black; }
        
        /* Tooltip */
        .tool-btn:hover::after { content: attr(data-info); position: absolute; right: 60px; background: #333; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; white-space: nowrap; }

        /* Search bar */
        #search-box { width: 100%; background: #111; border: 1px solid var(--neon); color: var(--neon); padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        
        .status-dot { height: 8px; width: 8px; background-color: var(--neon); border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div style="padding:20px; font-weight:bold; border-bottom:1px solid #222;">DEVICES_PANE</div>
        <div id="device-list"></div>
    </div>

    <div class="main">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>Sovereign Grid OS</h2>
            <button style="background:var(--neon); color:black; padding:10px; border:none; font-weight:bold; cursor:pointer;" onclick="fetch('/deploy',{method:'POST'})">🚀 GLOBAL YOLO</button>
        </div>

        <div id="modal">
            <div class="modal-display">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <h3 id="modal-title">INSPECTOR</h3>
                    <div id="view-tabs">
                        <button onclick="switchTab('terminal')" style="background:none; color:white; border:1px solid #555; cursor:pointer;">Terminal</button>
                        <button onclick="switchTab('inventory')" style="background:none; color:white; border:1px solid #555; cursor:pointer;">Inventory</button>
                    </div>
                </div>

                <div id="tab-terminal" class="tab-content active" style="white-space: pre-wrap;"></div>

                <div id="tab-inventory" class="tab-content">
                    <input type="text" id="search-box" placeholder="Search Libraries..." onkeyup="filterInventory()">
                    <div id="inventory-list" style="white-space: pre-wrap;"></div>
                </div>
            </div>

            <div class="toolbar">
                <button class="tool-btn" data-info="Speed Test" onclick="runNetCheck()">📶</button>
                <button class="tool-btn" data-info="Get Inventory" onclick="runInventory()">📋</button>
                <button class="tool-btn" data-info="Upload Script" onclick="triggerUpload()">📂</button>
                <button class="tool-btn" data-info="Auto-Schedule" onclick="alert('Smart AI Logic Active')">🧠</button>
                <button class="tool-btn" style="margin-top:auto; border-color:#ff3e3e; color:#ff3e3e;" onclick="closeModal()">[X]</button>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedNode = null;
        const nodeLogs = {};      // For network/upload outputs
        const nodeInventory = {}; // For the package lists

        socket.on('node_stats_update', (data) => {
            let item = document.getElementById('item-' + data.name);
            if (!item) {
                item = document.createElement('div');
                item.id = 'item-' + data.name;
                item.className = 'device-item';
                item.onclick = () => selectNode(data.name);
                document.getElementById('device-list').appendChild(item);
                nodeLogs[data.name] = `> Link Established with ${data.name}`;
                nodeInventory[data.name] = `Click the clipboard icon to fetch software.`;
            }
            item.innerHTML = `<span class="status-dot"></span><b>${data.name}</b><br><small>${data.gpu_temp}°C | VRAM: ${data.vram_free}MB</small>`;
        });

        socket.on('dashboard_log', (data) => {
            if (data.output.includes('--- SYSTEM:')) {
                nodeInventory[data.node] = data.output;
                if(selectedNode === data.node) switchTab('inventory');
            } else {
                nodeLogs[data.node] += `\n${data.output}`;
                if(selectedNode === data.node) switchTab('terminal');
            }
            updateViews();
        });

        function selectNode(name) {
            selectedNode = name;
            document.getElementById('modal').style.display = 'flex';
            document.getElementById('modal-title').innerText = `INSPECTING: ${name}`;
            updateViews();
        }

        function switchTab(type) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + type).classList.add('active');
        }

        function updateViews() {
            document.getElementById('tab-terminal').innerText = nodeLogs[selectedNode] || "";
            document.getElementById('inventory-list').innerText = nodeInventory[selectedNode] || "";
            document.getElementById('tab-terminal').scrollTop = document.getElementById('tab-terminal').scrollHeight;
        }

        function filterInventory() {
            const q = document.getElementById('search-box').value.toLowerCase();
            const list = nodeInventory[selectedNode].split('\n');
            const filtered = list.filter(line => line.toLowerCase().includes(q) || line.startsWith('---'));
            document.getElementById('inventory-list').innerText = filtered.join('\n');
        }

        async function runNetCheck() { fetchPost('/check_network'); }
        async function runInventory() { fetchPost('/trigger_inventory'); }
        
        async function fetchPost(endpoint) {
            const fd = new FormData(); fd.append("node_id", selectedNode);
            await fetch(endpoint, {method:'POST', body:fd});
        }

        function triggerUpload() {
            const input = document.createElement('input'); input.type = 'file';
            input.onchange = e => {
                const fd = new FormData(); fd.append("node_id", selectedNode); fd.append("file", e.target.files[0]);
                fetch('/upload_script', {method:'POST', body:fd});
            };
            input.click();
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }
    </script>
</body>
</html>
